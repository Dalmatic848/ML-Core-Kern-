[project]
name = "ml-core-kern"
version = "0.1.0"
description = "Литотипизация керна по фотографиям (ДС/УФ, dual-stream backbone)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data", "results", "logs", "models", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # длина строки — не блокирующая, полагаемся на здравый смысл

[tool.pytest.ini_options]
testpaths = ["tests"]
